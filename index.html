<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocaux reçus</title>
  <script>
    // Le même lien ouvert sur un téléphone mène à l'appli du téléphone.
    if (/Android|iPhone|iPad/i.test(navigator.userAgent)) location.replace('tel.html');
  </script>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=32">
  <link rel="preconnect" href="https://0.peerjs.com">
</head>
<body>
  <div class="ecran">
  <!-- Commandes envoyées au téléphone pendant l'appel. -->
  <aside class="pc-commandes">
    <button class="commande" id="photographier" disabled>
      <span class="commande-titre">📷 Photographier</span>
      <span class="commande-sous">Le téléphone prend une photo et l'envoie</span>
    </button>
    <button class="commande" id="recuperer" disabled>
      <span class="commande-titre">🎙 Récupérer le vocal</span>
      <span class="commande-sous" id="recuperer-sous">Pas d'appel en cours</span>
    </button>
    <p class="commande-info" id="commande-info" role="status"></p>
  </aside>

  <div class="pc">
    <header class="pc-haut">
      <div class="etat" id="etat" data-ton="attente">
        <span class="pastille"></span><span id="etat-texte">Connexion…</span>
      </div>
      <span class="chrono" id="chrono"></span>
      <div class="niveaux" id="niveaux" aria-hidden="true">
        <span>Ton micro</span>
        <div class="niveau"><div class="niveau-barre" id="niveau-micro"></div></div>
        <span>Téléphone</span>
        <div class="niveau"><div class="niveau-barre" id="niveau-tel"></div></div>
      </div>
      <button class="bouton-secondaire petit-bouton micro-bouton" id="micro-bouton">🎤 Micro activé</button>
      <label class="volume-tel" title="Au-delà de 100 %, la page amplifie le son du téléphone">Son du téléphone
        <input type="range" id="volume-tel" min="0" max="200" step="5" value="100">
        <span id="volume-tel-valeur">100 %</span>
      </label>
      <p class="alerte note-micro" id="note-micro">Clique sur « Autoriser » en haut de la page pour que le téléphone t'entende.</p>
    </header>

    <a class="zone-recu" id="zone-recu" data-etat="vide">
      <span class="recu-titre" id="recu-titre">Aucun vocal pour l'instant</span>
      <span class="recu-sous" id="recu-sous"></span>
      <span class="recu-indice" id="recu-indice"></span>
      <span class="recu-progression" id="recu-progression" hidden><span id="recu-barre"></span></span>
    </a>

    <section class="pc-liste">
      <div class="liste-tete">
        <h2 id="resume">Vocaux reçus</h2>
        <button class="bouton-secondaire" id="tout-effacer" hidden>Tout effacer</button>
      </div>
      <ol class="fichiers" id="vocaux"></ol>
    </section>
  </div>

  <!-- Lecture de texte : la voix de synthèse est envoyée dans l'appel, vers le téléphone. -->
  <aside class="lecture">
    <div class="lecture-tete">
      <h2 id="lecture-titre">Lire un texte au téléphone</h2>
      <button class="bouton-secondaire petit-bouton lecture-entrainement" id="lecture-entrainement" aria-pressed="false"
        title="Sans appel : la dictée sort sur l'ordinateur, rien ne passe par le téléphone ni par le relais">Entraînement</button>
      <label class="lecture-reglage">Vitesse
        <input type="range" id="lecture-vitesse" min="0.1" max="1" step="0.05" value="1">
        <span id="lecture-vitesse-valeur">1,00 ×</span>
      </label>
      <label class="lecture-reglage" title="À chaque point, la voix dit « point » puis attend 3 secondes">
        <input type="checkbox" id="lecture-dictee" checked> Dictée : dit « point », puis 3 s de pause
      </label>
      <label class="lecture-reglage" title="La voix s'arrête après chaque groupe de mots, le temps indiqué">
        <input type="checkbox" id="lecture-groupes"> Pause tous les
        <input type="number" id="lecture-groupes-mots" min="1" max="200" step="1" value="5" aria-label="Nombre de mots"> mots, pendant
        <input type="number" id="lecture-groupes-pause" min="0" max="60" step="0.5" value="2" aria-label="Durée de la pause en secondes"> s
      </label>
    </div>
    <textarea class="lecture-texte" id="lecture-saisie" placeholder="Colle ici le texte à lire…" spellcheck="false"></textarea>
    <div class="lecture-texte lecture-affichage" id="lecture-affichage" hidden></div>
    <p class="lecture-etat" id="lecture-etat" data-ton="neutre"></p>
    <div class="lecture-boutons">
      <button class="bouton-principal" id="lecture-lire">Lire</button>
      <button class="bouton-principal" id="lecture-pause" hidden>Pause</button>
      <button class="bouton-secondaire" id="lecture-arreter" hidden>Arrêter</button>
    </div>
  </aside>
  </div>

  <div class="voile" id="activer-son" hidden>Clique n'importe où pour entendre l'appel</div>
  <audio id="son-distant" autoplay></audio>

  <script src="peerjs.min.js?v=1.5.5"></script>
  <script src="commun.js?v=19"></script>
  <script src="ecoute.js?v=33"></script>
  <script src="lecture.js?v=30"></script>
</body>
</html>
