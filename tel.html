<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#157347">
  <title>Vocal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=19">
  <!-- Le serveur de mise en relation : la connexion se prépare pendant le chargement de la page. -->
  <link rel="preconnect" href="https://0.peerjs.com">
</head>
<body>
  <div class="tel">
    <header class="tel-haut">
      <div class="etat" id="etat" data-ton="attente">
        <span class="pastille"></span><span id="etat-texte">Démarrage…</span>
      </div>
      <span class="chrono" id="chrono"></span>
      <button class="raccrocher" id="raccrocher" hidden>Raccrocher</button>
    </header>

    <main class="tel-milieu">
      <section class="direct">
        <div class="niveaux" aria-hidden="true">
          <span>Toi</span>
          <div class="niveau"><div class="niveau-barre" id="niveau"></div></div>
          <span>Ordinateur</span>
          <div class="niveau"><div class="niveau-barre" id="niveau-ordi"></div></div>
        </div>
        <button class="bouton-secondaire bouton-photo" id="photo">📷 Photo d'une feuille</button>
        <p class="alerte" id="alerte" hidden></p>
        <p class="petit" id="telecommande" hidden>🎧 Le bouton pause/lecture des écouteurs envoie aussi le vocal, même écran éteint (bip-bip = envoyé).</p>
        <button class="bouton-secondaire" id="ecran-noir" hidden>Écran noir (l'appel continue, double-touche pour revenir)</button>
      </section>

      <section class="volume" id="volume" hidden>
        <div class="volume-tete"><span>Volume</span><span id="volume-valeur"></span></div>
        <div class="volume-reglage">
          <button class="volume-bouton" id="volume-moins" aria-label="Baisser le volume">−</button>
          <input type="range" id="volume-curseur" min="0" max="100" step="1" aria-label="Volume">
          <button class="volume-bouton" id="volume-plus" aria-label="Monter le volume">+</button>
        </div>
      </section>

      <section class="journal" id="journal" hidden>
        <h2>Envois</h2>
        <ol class="liste" id="liste"></ol>
      </section>
    </main>

    <button class="gros-bouton" id="gros-bouton" disabled>
      <span class="bouton-titre" id="bouton-titre">Envoyer</span>
      <span class="bouton-sous" id="bouton-sous">Autorise le micro pour commencer</span>
    </button>
  </div>

  <!-- Appareil photo en mode document : viseur avec cadre A4, puis aperçu « scan » avant l'envoi. -->
  <div class="camera" id="camera" hidden>
    <video class="camera-video" id="camera-video" autoplay playsinline muted></video>
    <div class="camera-cadre" id="camera-cadre" aria-hidden="true"></div>
    <img class="camera-apercu" id="camera-apercu" alt="Photo prise" hidden>
    <p class="camera-aide" id="camera-aide">Cadre toute la feuille, bien à plat et éclairée</p>
    <div class="camera-barre" id="camera-barre-prise">
      <button class="camera-petit" id="camera-annuler">Annuler</button>
      <button class="camera-declencheur" id="camera-prendre" aria-label="Prendre la photo"></button>
    </div>
    <div class="camera-barre" id="camera-barre-envoi" hidden>
      <button class="camera-petit" id="camera-reprendre">Reprendre</button>
      <button class="camera-petit" id="camera-scan" aria-pressed="true">Texte net</button>
      <button class="camera-envoyer" id="camera-envoyer">Envoyer</button>
    </div>
  </div>

  <div class="voile" id="voile" hidden>Touche l'écran pour entendre l'ordinateur</div>
  <audio id="son-distant" autoplay playsinline></audio>

  <script src="peerjs.min.js?v=1.5.5"></script>
  <script src="commun.js?v=19"></script>
  <script src="telephone.js?v=20"></script>
</body>
</html>
